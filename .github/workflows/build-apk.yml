name: Build SensorsOff APK & Auto Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -noprompt -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --parallel --build-cache --configuration-cache -x lint -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensorsOff-APK
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 1

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.0' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'SensorsOff Release v1.3.0' }}
          body: |
            Automated Release for SensorsOff Tile Reborn APK (v1.3.0)

            ### Features
            - Quick Settings SensorsOff Tile
            - Shizuku & Root SU Permission Integration
            - Monitored Hardware Sensors Panel
            - Real-time Console Log Tracker
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

