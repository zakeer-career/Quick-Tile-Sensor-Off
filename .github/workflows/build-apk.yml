name: Build SensorsOff APK & Auto Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="2.0"
          fi
          echo "VERSION_TAG=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted app version: v${VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -noprompt -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --parallel --build-cache --configuration-cache -x lint -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensorsOff-APK
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 1

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.VERSION_TAG }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.VERSION_TAG }}
          body: |
            SensorsOff Release ${{ steps.get_version.outputs.VERSION_TAG }}

            ### What's New
            - Active Pre-warmed TileService with zero-latency quick toggle
            - Direct SystemUI synchronization and instant state reflection
            - Multi-backend privilege execution (Shizuku, Root su, ADB Secure Settings)
            - Live hardware sensor telemetry and diagnostics matrix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

