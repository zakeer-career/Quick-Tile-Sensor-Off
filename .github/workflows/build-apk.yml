name: Build SensorsOff APK & Auto Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="2.0"
          fi
          echo "VERSION_TAG=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted app version: v${VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 1024 -validity 10000 -dname "CN=Debug"
          fi

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g' -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: gradle :app:assembleDebug --parallel --build-cache -x lint -x test -x check

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensorsOff-APK
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0

      - name: Generate Release Notes from CHANGELOG
        run: |
          if [ -f CHANGELOG.md ]; then
            awk '/^## \[/{count++} count==1{if ($0 ~ /^---/) exit; print}' CHANGELOG.md > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "### SensorsOff Release ${{ steps.get_version.outputs.VERSION_TAG }}" > RELEASE_NOTES.md
            echo "Automatic build and release from SensorsOff repository." >> RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.VERSION_TAG }}
          name: SensorsOff ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.VERSION_TAG }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

